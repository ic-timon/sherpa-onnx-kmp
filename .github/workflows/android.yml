name: android

on:
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'native/**'
      - 'patches/**'
      - 'samples/android-app/**'
      - 'scripts/**'
      - 'sherpa-onnx-kmp/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'native/**'
      - 'patches/**'
      - 'samples/android-app/**'
      - 'scripts/**'
      - 'sherpa-onnx-kmp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-abis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            build_dir: android-arm64
          - abi: armeabi-v7a
            build_dir: android-armv7
          - abi: x86
            build_dir: android-x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Android NDK
        run: |
          if [[ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          fi
      - name: Cache native dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-onnx-kmp
            build/${{ matrix.build_dir }}
            build/upstream
          key: android-${{ matrix.abi }}-${{ hashFiles('scripts/fetch-native-deps.sh', 'patches/0001-parse-options-try-set-option.patch', 'native/**') }}
      - name: Build ABI
        env:
          ANDROID_ABI: ${{ matrix.abi }}
        run: ./scripts/build-android-native.sh

  # The emulator job above exercises x86_64 because that is the ABI a
  # GitHub-hosted x86 runner can execute with KVM. The arm64-v8a slice is the
  # primary ABI for real phones, so it gets its own job on an arm64 runner.
  # Without it, arm64-v8a is compiled and symbol-checked but never executed.
  emulator-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android NDK
        run: |
          if [[ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          fi
      - name: Verify KVM is available
        run: |
          # On an arm64 host the arm64 emulator needs KVM to be usable at all.
          # Software emulation would take longer than the job timeout for a
          # single inference, so a missing /dev/kvm is a hard failure, not a
          # reason to fall back.
          test -e /dev/kvm || {
            echo "No /dev/kvm on this runner; an arm64 emulator cannot run here" >&2
            exit 1
          }
          ls -l /dev/kvm
      - name: Cache native dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-onnx-kmp
            build/android-arm64-v8a
            build/upstream
          key: android-arm64-v8a-${{ hashFiles('scripts/fetch-native-deps.sh', 'patches/0001-parse-options-try-set-option.patch', 'native/**') }}
      - name: Build Android JNI libraries
        env:
          ANDROID_ABI: arm64-v8a
        run: ./scripts/build-android-native.sh
      - name: Prepare pinned model assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-android-test-assets.sh
      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :sherpa-onnx-kmp:connectedAndroidDeviceTest --stacktrace

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android NDK
        run: |
          if [[ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ensure Android NDK
        run: |
          if [[ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          fi
      - name: Cache native dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-onnx-kmp
            build/android-x86_64
            build/upstream
          key: android-x86_64-${{ hashFiles('scripts/fetch-native-deps.sh', 'patches/0001-parse-options-try-set-option.patch', 'native/**') }}
      - name: Build Android JNI libraries
        env:
          ANDROID_ABI: x86_64
        run: ./scripts/build-android-native.sh
      - name: Prepare pinned model assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-android-test-assets.sh
      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :sherpa-onnx-kmp:connectedAndroidDeviceTest :samples:android-app:assembleDebug --stacktrace
