name: portable-bridge

on:
  pull_request:
    paths:
      - '.github/workflows/portable-bridge.yml'
      - 'native/**'
      - 'patches/**'
      - 'scripts/bootstrap-sherpa-source.sh'
      - 'scripts/fetch-native-deps.sh'
      - 'scripts/lib.sh'
      - 'scripts/test-bridge-integration.sh'
      - 'sherpa-onnx-kmp/src/commonMain/kotlin/com/k2fsa/sherpa/onnx/kmp/internal/OfflineAsrBridgeOptions.kt'
      - 'sherpa-onnx-kmp/src/commonTest/kotlin/com/k2fsa/sherpa/onnx/kmp/internal/OfflineAsrBridgeOptionsTest.kt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable-bridge.yml'
      - 'native/**'
      - 'patches/**'
      - 'scripts/**'
      - 'sherpa-onnx-kmp/src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache native dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-onnx-kmp
            build/native
            build/upstream
          key: portable-bridge-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-native-deps.sh', 'patches/0001-parse-options-try-set-option.patch') }}
      - name: Fetch pinned native dependencies
        run: ./scripts/fetch-native-deps.sh
      - name: Bootstrap patched sherpa-onnx source
        run: |
          source_dir=$(./scripts/bootstrap-sherpa-source.sh | tail -n 1)
          echo "SHERPA_ONNX_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
      - name: Configure portable bridge
        run: |
          cmake -S native -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSHERPA_ONNX_SOURCE_DIR="$SHERPA_ONNX_SOURCE_DIR" \
            -DSHERPA_ONNX_KMP_BUILD_TESTS=ON
      - name: Build portable bridge
        run: cmake --build build/native -j 4
      - name: Run bridge tests
        run: ctest --test-dir build/native --output-on-failure
      - name: Run pinned-model integration test
        run: ./scripts/test-bridge-integration.sh
      - name: Run JVM JNI integration test
        env:
          SHERPA_ONNX_KMP_NATIVE_PATH: ${{ github.workspace }}/build/native/lib
        run: |
          export SHERPA_ONNX_KMP_TEST_MODEL_DIR="$HOME/.cache/sherpa-onnx-kmp/models/sherpa-onnx-nemo-ctc-fa-shenava-rizeh-pizeh-v1.0-non-streaming-int8-2026-06-26"
          ./gradlew :sherpa-onnx-kmp:jvmTest --rerun-tasks --stacktrace
      - name: Fetch pinned feature models
        run: ./scripts/prepare-feature-models.sh
      # `$HOME` is expanded by the shell inside `run`, not by the workflow
      # expression evaluator: `env.HOME` is not a valid context there and
      # silently produced `/.cache/...`.
      - name: Run bridge ABI and feature probe
        run: |
          export SHERPA_ONNX_KMP_FEATURE_MODEL_DIR="$HOME/.cache/sherpa-onnx-kmp/feature-models"
          ./scripts/test-bridge-abi.sh build/native
      - name: Run feature integration tests against real models
        env:
          SHERPA_ONNX_KMP_NATIVE_PATH: ${{ github.workspace }}/build/native/lib
        run: |
          export SHERPA_ONNX_KMP_FEATURE_MODEL_DIR="$HOME/.cache/sherpa-onnx-kmp/feature-models"
          export SHERPA_ONNX_KMP_TEST_MODEL_DIR="$HOME/.cache/sherpa-onnx-kmp/models/sherpa-onnx-nemo-ctc-fa-shenava-rizeh-pizeh-v1.0-non-streaming-int8-2026-06-26"
          ./gradlew :sherpa-onnx-kmp:jvmTest --tests '*JvmFeatureIntegrationTest*' --rerun-tasks --stacktrace
      - name: Release hardening checks
        env:
          # The memory-growth run takes minutes; the ABI and dependency audit is
          # the part that must gate a merge, and the long run happens on the
          # release branch.
          SHERPA_ONNX_KMP_LEAK_FAST: '1'
        run: |
          export SHERPA_ONNX_KMP_FEATURE_MODEL_DIR="$HOME/.cache/sherpa-onnx-kmp/feature-models"
          ./scripts/check-release-hardening.sh build/native
      - name: Record the performance baseline
        run: |
          export SHERPA_ONNX_KMP_FEATURE_MODEL_DIR="$HOME/.cache/sherpa-onnx-kmp/feature-models"
          export SHERPA_ONNX_KMP_TEST_MODEL_DIR="$HOME/.cache/sherpa-onnx-kmp/models/sherpa-onnx-nemo-ctc-fa-shenava-rizeh-pizeh-v1.0-non-streaming-int8-2026-06-26"
          ./scripts/benchmark-release.sh build/release/benchmarks.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: build/release/benchmarks.json
