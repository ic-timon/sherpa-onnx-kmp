name: platform-native

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linuxX64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sherpa-onnx-kmp:linuxX64Test --stacktrace

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sherpa-onnx-kmp:mingwX64Test --stacktrace
      - shell: pwsh
        run: ./gradlew :sherpa-onnx-kmp:compileKotlinMingwX64 --stacktrace
