name: platform-native

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/platform-native.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'native/**'
      - 'patches/**'
      - 'scripts/**'
      - 'sherpa-onnx-kmp/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-native.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'native/**'
      - 'patches/**'
      - 'scripts/**'
      - 'sherpa-onnx-kmp/**'
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: platform-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential
          cmake --version
          ninja --version
      - name: Cache native desktop dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-onnx-kmp
            build/native-desktop
            build/upstream
            ~/.konan
          key: desktop-linux-x64-${{ hashFiles('scripts/fetch-native-deps.sh', 'patches/0001-parse-options-try-set-option.patch', 'native/**', 'sherpa-onnx-kmp/build.gradle.kts') }}
      - name: Build native desktop libraries
        run: ./scripts/build-native-desktop.sh linux-x64
      - name: Inspect runtime dependencies
        run: |
          lib=build/native-desktop/linux-x64/lib/libsherpa-onnx-kmp-native-desktop.a
          test -f "$lib"
          if nm -g --undefined-only "$lib" | grep -qi onnxruntime; then
            echo "Unexpected external ONNX Runtime dependency" >&2
            exit 1
          fi
          nm -g --defined-only "$lib" | grep -q 'SherpaOnnxBridgeAbiVersion'
          nm -g --defined-only "$lib" | grep -q 'OrtGetApiBase'
          echo "Runtime dependency inspection: OK"
      - name: Build and test Linux x64 KMP target
        run: ./gradlew :sherpa-onnx-kmp:linuxX64Test --stacktrace

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential
      - name: Cache native desktop dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-onnx-kmp
            build/native-desktop
            build/upstream
            ~/.konan
          key: desktop-linux-arm64-${{ hashFiles('scripts/fetch-native-deps.sh', 'patches/0001-parse-options-try-set-option.patch', 'native/**', 'sherpa-onnx-kmp/build.gradle.kts') }}
      - name: Build native desktop libraries
        run: ./scripts/build-native-desktop.sh linux-arm64
      - name: Build and test Linux arm64 KMP target
        run: ./gradlew :sherpa-onnx-kmp:linuxArm64Test --stacktrace

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git
            unzip
            tar
      - name: Cache native desktop dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\msys64\home\runneradmin\.cache\sherpa-onnx-kmp
            build\native-desktop
            build\upstream
          key: desktop-windows-x64-${{ hashFiles('scripts/fetch-native-deps.sh', 'patches/0001-parse-options-try-set-option.patch', 'native/**', 'sherpa-onnx-kmp/build.gradle.kts') }}
      - name: Build native desktop libraries
        run: ./scripts/build-native-desktop.sh windows-x64
      - name: Build and test Windows x64 KMP target
        run: ./gradlew :sherpa-onnx-kmp:mingwX64Test --stacktrace
