name: platform-native

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/platform-native.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'native/**'
      - 'patches/**'
      - 'scripts/**'
      - 'sherpa-onnx-kmp/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-native.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'native/**'
      - 'patches/**'
      - 'scripts/**'
      - 'sherpa-onnx-kmp/**'
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: platform-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential
          cmake --version
          ninja --version
      - name: Cache native desktop dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-onnx-kmp
            build/native-desktop
            build/upstream
            ~/.konan
          key: desktop-linux-x64-${{ hashFiles('scripts/fetch-native-deps.sh', 'patches/0001-parse-options-try-set-option.patch', 'native/**', 'sherpa-onnx-kmp/build.gradle.kts') }}
      - name: Build native desktop libraries
        run: ./scripts/build-native-desktop.sh linux-x64
      - name: Inspect runtime dependencies
        run: |
          lib=build/native-desktop/linux-x64/lib/libsherpa-onnx-kmp-native-desktop.a
          test -f "$lib"
          # Materialize the symbol names once. Piping a large archive's nm output
          # straight into `grep -q` raises SIGPIPE and, under pipefail, fails the
          # step even when the symbol is present.
          nm -g --defined-only "$lib" 2>/dev/null | awk '{print $NF}' > /tmp/defined.txt || true
          nm -g --undefined-only "$lib" 2>/dev/null | awk '{print $NF}' > /tmp/undefined.txt || true
          wc -l /tmp/defined.txt /tmp/undefined.txt
          grep -Fxq 'SherpaOnnxBridgeAbiVersion' /tmp/defined.txt || {
            echo "Missing SherpaOnnxBridgeAbiVersion" >&2; exit 1; }
          grep -Fxq 'OrtGetApiBase' /tmp/defined.txt || {
            echo "Missing OrtGetApiBase" >&2; exit 1; }
          for entry in OrtCreateSession OrtRun OrtCreateEnv OrtReleaseEnv; do
            if grep -Fxq "$entry" /tmp/undefined.txt; then
              echo "Undefined ONNX Runtime C entry point: $entry" >&2
              exit 1
            fi
          done
          echo "Runtime dependency inspection: OK"
      - name: Build and test Linux x64 KMP target
        run: ./gradlew :sherpa-onnx-kmp:linuxX64Test --stacktrace

  linux-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential \
            g++-aarch64-linux-gnu qemu-user-static
      - name: Cache native desktop dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-onnx-kmp
            build/native-desktop
            build/upstream
            ~/.konan
          key: desktop-linux-arm64-${{ hashFiles('scripts/fetch-native-deps.sh', 'patches/0001-parse-options-try-set-option.patch', 'native/**', 'sherpa-onnx-kmp/build.gradle.kts') }}
      - name: Build native desktop libraries
        run: ./scripts/build-native-desktop.sh linux-arm64
      - name: Inspect runtime dependencies
        run: |
          lib=build/native-desktop/linux-arm64/lib/libsherpa-onnx-kmp-native-desktop.a
          test -f "$lib"
          # An `ar` archive reports as "current ar archive", not as an arch, so
          # the architecture check inspects a member object instead.
          member=$(ar t "$lib" | head -n 1)
          tmpdir=$(mktemp -d)
          (cd "$tmpdir" && ar x "$lib" "$member")
          file "$tmpdir/$member" | grep -q 'aarch64' || {
            echo "Aggregate archive members are not aarch64" >&2
            file "$tmpdir/$member" >&2
            exit 1
          }
          rm -rf "$tmpdir"
          # Extract just the symbol names. `nm` prefixes a type letter and, for
          # defined symbols, an address, so the last field is the name.
          aarch64-linux-gnu-nm -g --defined-only "$lib" 2>/dev/null \
            | awk '{print $NF}' > /tmp/defined-arm64.txt || true
          aarch64-linux-gnu-nm -g --undefined-only "$lib" 2>/dev/null \
            | awk '{print $NF}' > /tmp/undefined-arm64.txt || true
          wc -l /tmp/defined-arm64.txt /tmp/undefined-arm64.txt
          grep -Fxq 'SherpaOnnxBridgeAbiVersion' /tmp/defined-arm64.txt || {
            echo "Missing SherpaOnnxBridgeAbiVersion" >&2; exit 1; }
          grep -Fxq 'OrtGetApiBase' /tmp/defined-arm64.txt || {
            echo "Missing OrtGetApiBase" >&2; exit 1; }
          for entry in OrtCreateSession OrtRun OrtCreateEnv OrtReleaseEnv; do
            if grep -Fxq "$entry" /tmp/undefined-arm64.txt; then
              echo "Undefined ONNX Runtime C entry point: $entry" >&2
              exit 1
            fi
          done
          echo "Runtime dependency inspection: OK"
      - name: Link Linux arm64 test binary
        run: >-
          ./gradlew
          :sherpa-onnx-kmp:linkDebugTestLinuxArm64
          --stacktrace
      - name: Run Linux arm64 tests under qemu
        run: |
          binary=$(find sherpa-onnx-kmp/build/bin/linuxArm64 -name "*.kexe" | head -n 1)
          if [[ -z "$binary" ]]; then
            echo "Linux arm64 test binary was not produced" >&2
            exit 1
          fi
          file "$binary" | grep -q 'aarch64'
          qemu-aarch64-static -L /usr/aarch64-linux-gnu "$binary"

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify MSVC toolchain
        run: |
          cmake --version
          cmake -G "Visual Studio 17 2022" -A x64 -S native -B build/toolchain-probe \
            -DSHERPA_ONNX_KMP_BUILD_JNI=OFF \
            -DSHERPA_ONNX_KMP_BUILD_TESTS=OFF 2>&1 | tail -5 || true
          ls build/toolchain-probe | head
      - name: Cache native desktop dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-onnx-kmp
            build/native-desktop
            build/upstream
          key: desktop-windows-x64-msvc-${{ hashFiles('scripts/fetch-native-deps.sh', 'patches/0001-parse-options-try-set-option.patch', 'native/**', 'sherpa-onnx-kmp/build.gradle.kts') }}
      - name: Build native desktop libraries
        shell: bash
        run: ./scripts/build-native-desktop.sh windows-x64
      - name: Inspect runtime dependencies
        shell: bash
        run: |
          dll=build/native-desktop/windows-x64/lib/sherpa-onnx-portable-bridge.dll
          implib=build/native-desktop/windows-x64/lib/sherpa-onnx-portable-bridge.lib
          test -f "$dll"
          test -f "$implib"
          # `nm` from the MSYS2/Git Bash toolchain on the runner understands PE
          # COFF import libraries, so the export check uses the import library
          # instead of `dumpbin`, which is only on PATH inside a VS dev shell.
          nm -g --defined-only "$implib" > /tmp/implib-symbols.txt
          for symbol in \
            SherpaOnnxBridgeAbiVersion \
            SherpaOnnxBridgeInfoJson \
            SherpaOnnxBridgeCreate \
            SherpaOnnxBridgeCall \
            SherpaOnnxBridgePushAudio \
            SherpaOnnxBridgeDestroy \
            SherpaOnnxBridgeFree; do
            grep -q "$symbol" /tmp/implib-symbols.txt || {
              echo "Import library is missing $symbol" >&2; exit 1; }
          done
          if find build/native-desktop/windows-x64 -iname 'onnxruntime.dll' | grep -q .; then
            echo "A separate ONNX Runtime DLL was produced; ORT must be static" >&2
            exit 1
          fi
          echo "Runtime dependency inspection: OK"
      - name: Build and test Windows x64 KMP target
        shell: bash
        run: ./gradlew :sherpa-onnx-kmp:mingwX64Test --stacktrace
